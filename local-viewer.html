<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer local - Facture electronique</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        border-bottom: 1px solid #e2e8f0;
        background: rgba(255, 255, 255, 0.96);
        padding: 16px 24px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
      }

      p {
        margin: 8px 0 0;
        color: #475569;
        font-size: 13px;
        word-break: break-all;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      a,
      button {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: #334155;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 10px;
        text-decoration: none;
      }

      main {
        padding: 16px;
      }

      iframe {
        width: 100%;
        height: calc(100vh - 132px);
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
      }

      pre,
      .empty {
        min-height: calc(100vh - 172px);
        overflow: auto;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
        padding: 16px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Document local</h1>
      <p id="path"></p>
      <div class="actions">
        <a id="rawLink" href="#" target="_blank" rel="noreferrer">Ouvrir brut</a>
        <button id="copyLink" type="button">Copier le lien</button>
      </div>
    </header>
    <main id="content"></main>
    <script type="module" src="/local-viewer.js"></script>
  </body>
</html>
