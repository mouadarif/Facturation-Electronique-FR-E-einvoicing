<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; connect-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viewer local - Facture electronique</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        margin: 0;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        border-bottom: 1px solid #e2e8f0;
        background: rgba(255, 255, 255, 0.96);
        padding: 16px 24px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
      }

      p {
        margin: 8px 0 0;
        color: #475569;
        font-size: 13px;
        word-break: break-all;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      a,
      button {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: #334155;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        padding: 8px 10px;
        text-decoration: none;
      }

      main {
        padding: 16px;
      }

      iframe {
        width: 100%;
        height: calc(100vh - 132px);
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
      }

      pre,
      .empty,
      .markdown-body {
        min-height: calc(100vh - 172px);
        overflow: auto;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
        padding: 16px;
      }

      pre,
      .empty {
        white-space: pre-wrap;
      }

      .markdown-body {
        box-sizing: border-box;
        color: #1e293b;
        font-size: 15px;
        line-height: 1.72;
        margin: 0 auto;
        max-width: 980px;
        padding: 32px;
      }

      .markdown-body h1,
      .markdown-body h2,
      .markdown-body h3 {
        color: #0f172a;
        line-height: 1.25;
        margin: 1.8em 0 0.6em;
      }

      .markdown-body h1 {
        border-bottom: 1px solid #e2e8f0;
        font-size: 30px;
        padding-bottom: 12px;
      }

      .markdown-body h2 {
        border-bottom: 1px solid #edf2f7;
        font-size: 22px;
        padding-bottom: 8px;
      }

      .markdown-body h3 {
        font-size: 18px;
      }

      .markdown-body h1:first-child,
      .markdown-body h2:first-child,
      .markdown-body h3:first-child {
        margin-top: 0;
      }

      .markdown-body p,
      .markdown-body li {
        color: #334155;
        font-size: 15px;
        word-break: normal;
      }

      .markdown-body a {
        border: 0;
        color: #2563eb;
        font-size: inherit;
        font-weight: 600;
        padding: 0;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .markdown-body table {
        border-collapse: collapse;
        display: block;
        margin: 18px 0;
        overflow-x: auto;
        width: 100%;
      }

      .markdown-body th,
      .markdown-body td {
        border: 1px solid #dbe3ef;
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
      }

      .markdown-body th {
        background: #f8fafc;
        color: #0f172a;
        font-weight: 700;
      }

      .markdown-body blockquote {
        border-left: 4px solid #93c5fd;
        color: #475569;
        margin: 18px 0;
        padding: 2px 0 2px 16px;
      }

      .markdown-body code {
        background: #f1f5f9;
        border-radius: 5px;
        color: #0f172a;
        font-family: Consolas, Monaco, "Courier New", monospace;
        font-size: 0.92em;
        padding: 2px 5px;
      }

      .markdown-body pre {
        background: #0f172a;
        border: 0;
        color: #e2e8f0;
        min-height: 0;
        overflow: auto;
        padding: 16px;
        white-space: pre;
      }

      .markdown-body pre code {
        background: transparent;
        color: inherit;
        padding: 0;
      }

      @media (max-width: 720px) {
        header {
          padding: 14px 16px;
        }

        main {
          padding: 10px;
        }

        .markdown-body {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Document local</h1>
      <p id="path"></p>
      <div class="actions">
        <a id="rawLink" href="#" target="_blank" rel="noreferrer">Ouvrir brut</a>
        <button id="copyLink" type="button">Copier le lien</button>
      </div>
    </header>
    <main id="content"></main>
    <script type="module" src="/local-viewer.js"></script>
  </body>
</html>
